name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: true
          verify-signature: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Create CI truststore
        shell: bash
        run: |
          mkdir -p gradle/certs
          # gradle.properties はパスワードを持たないため、パスワードなしで読める形式で作り直す
          rm -f gradle/certs/gradle-truststore.p12
          keytool -J-Dkeystore.pkcs12.certProtectionAlgorithm=NONE \
            -J-Dkeystore.pkcs12.macAlgorithm=NONE \
            -importkeystore \
            -srckeystore "$JAVA_HOME/lib/security/cacerts" \
            -srcstorepass changeit \
            -destkeystore gradle/certs/gradle-truststore.p12 \
            -deststoretype PKCS12 \
            -deststorepass changeit \
            -noprompt

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show Gradle wrapper version
        run: ./gradlew --version

      - name: Test
        run: ./gradlew test --dependency-verification strict --stacktrace

      - name: Build
        run: |
          ./gradlew build --dependency-verification strict --stacktrace

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
